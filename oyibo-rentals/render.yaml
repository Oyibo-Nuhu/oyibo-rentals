# Render Blueprint: creates the web app and a PostgreSQL database in one go.
# In Render: New + → Blueprint → pick this repo.
services:
  - type: web
    name: oyibo-rentals
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: oyibo-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false          # Render asks you for these when you create the Blueprint
      - key: ADMIN_PASSWORD
        sync: false
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: PUBLIC_URL
        sync: false          # e.g. https://oyibo-rentals.onrender.com
      - key: SEED_DEMO_DATA
        value: "true"
      - key: RUN_TRACKING_SIMULATOR
        value: "true"

databases:
  - name: oyibo-db
    plan: free
    databaseName: oyibo
